# Adapted from PyKale's documentation.md, as an issue form in KaleCardiac's style.
name: "\U0001F4DA Documentation"
description: Report missing, wrong or unclear KaleCardiac documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - README or quickstart
        - Architecture (docs/architecture.md)
        - Models and fusion (docs/models.md, docs/multimodal_fusion.md)
        - API overview or reference (API_overview.md, docs/)
        - CONTRIBUTING or AGENTS
        - Docstrings
        - An example or tutorial notebook
        - Not sure
    validations:
      required: true

  - type: textarea
    id: missing
    attributes:
      label: Is there documentation missing?
      description: Let us know which modules have missing or incomplete documentation.

  - type: textarea
    id: wrong
    attributes:
      label: Is documentation wrong?
      description: Let us know if you find a mistake, and what the code actually does.

  - type: textarea
    id: example
    attributes:
      label: Is there a feature that needs some example code?
      description: Let us know if we're missing an example or notebook.

  - type: dropdown
    id: pull-request
    attributes:
      label: Think you know how to fix the docs?
      description: If so, we'd love a pull request from you!
      options:
        - "Yes, I can open a pull request"
        - "No"

  - type: checkboxes
    id: no-patient-data
    attributes:
      label: Data
      options:
        - label: This report contains no patient data, identifiers or paths from a clinical system.
          required: true
