# Adapted from PyKale's refactor.md, as an issue form in KaleCardiac's style.
name: "\U0001F527 Refactor"
description: Propose a refactor, speed-up or other improvement to KaleCardiac's internals
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: refactor
    attributes:
      label: What to refactor, and why
      description: A clear and concise description of what you wish to refactor.
    validations:
      required: true

  - type: textarea
    id: modules
    attributes:
      label: Modules that will be modified
      placeholder: e.g. kalecardiac/model/embed/multimodal_fusion.py, kalecardiac/pipeline/trainer.py
    validations:
      required: true

  - type: textarea
    id: structure
    attributes:
      label: Impact on code structure
      description: >-
        The pipeline stages depend downstream, never upstream; see
        [docs/architecture.md](https://github.com/pykale/cardiac/blob/main/docs/architecture.md).

  - type: textarea
    id: speed
    attributes:
      label: Impact on speed
      description: Measurements, if you have them.

  - type: dropdown
    id: breaking
    attributes:
      label: Will this be a breaking change?
      description: >-
        Breaking means a public API, a configuration key, a saved checkpoint or a result users rely on changes.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: scientific-behaviour
    attributes:
      label: Scientific behaviour
      options:
        - label: >-
            If this changes a published model's behaviour, I will document the departure in docs/models.md and test it.

  - type: checkboxes
    id: no-patient-data
    attributes:
      label: Data
      options:
        - label: This proposal contains no patient data, identifiers or paths from a clinical system.
          required: true
