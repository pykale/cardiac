# Fine-tuning in the CardioVAE tutorial, tutorials/cardiac-abnormality-assessment/tutorial-CardioVAE.ipynb.
#
# Merged onto this example's defaults, as the pretraining configuration is, so both describe
# the same model. The pretrained encoders stay frozen under a classification head trained on
# labels.csv -- subject_id,label: 0 healthy, 1 cardiothoracic abnormality -- with one
# stratified held-out test split rather than this example's cross-validation, the tutorial
# dataset having twenty subjects.
DATASET:
  ROOT: "data/kalecardiac_finetuning"
  SPLIT_MODE: "random"
  TEST_RATIO: 0.2
  VAL_RATIO: 0.2

ENDPOINT:
  NAME: "cardiothoracic_abnormality"
  LABEL_COLUMN: "label"
  VALUE_COLUMN: ""
  UNIT: ""

MODEL:
  # The pretrained model's width.
  LATENT_DIM: 128

SOLVER:
  SEED: 42

FINETUNE:
  MAX_EPOCHS: 20
  BATCH_SIZE: 4

OUTPUT:
  OUT_DIR: "outputs/cardiovae_tutorial/finetuning"
